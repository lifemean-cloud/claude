# ============================================================
#  자동 출근부 — 내 컴퓨터가 꺼져 있어도 GitHub 가상 컴퓨터가 대신 실행합니다.
#
#  언제 실행되나요?
#   ① 매일 밤 12시(한국 시간) 자동
#   ② Actions 탭의 [Run workflow] 버튼 (지시문을 직접 적을 수도 있음)
#   ③ 회사 Claude 등 외부에서 명령 (아래 '원격 실행 방법' 참고)
#
#  무엇을 하나요?
#   - skills-lock.json 에 등록된 모든 스킬 + 폴더에 추가된 스킬,
#     CLAUDE.md / AGENTS.md / rules/*.md 지침 파일을 자동으로 읽고
#   - 그 규칙대로 결과물을 만든 뒤 한 번 더 검수·개선해서
#   - output/ 폴더에 저장하고 이 저장소로 백업(커밋+푸시)합니다.
#   - memory/ 의 기억(직접 적는 MEMORY.md + 자동 기록 log.md)을 읽고,
#     오늘 한 일을 log.md 에 덧붙여 함께 백업합니다. (가상 컴퓨터가 꺼져도 기억 유지)
#
#  원격 실행 방법 (회사 컴퓨터에서, gh CLI 로그인 상태):
#   gh workflow run auto_run.yml -R lifemean-cloud/claude
#   gh workflow run auto_run.yml -R lifemean-cloud/claude -f task="오늘은 OO 소개 페이지를 만들어줘"
#  또는 REST API (repo 권한 토큰 필요):
#   curl -X POST -H "Authorization: Bearer <토큰>" \
#     https://api.github.com/repos/lifemean-cloud/claude/dispatches \
#     -d '{"event_type":"run-now","client_payload":{"task":"지시문"}}'
# ============================================================
name: 자동 실행 (auto_run)

on:
  schedule:
    # GitHub 시계는 UTC 기준 → UTC 15:00 = 한국 시간 00:00 (자정)
    # ※ GitHub 사정으로 몇 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "이번 실행에만 쓸 지시문 (비워두면 tasks/daily_task.md 사용)"
        required: false
        default: ""
      refine_passes:
        description: "검수·개선 횟수 (0이면 초안 그대로)"
        required: false
        default: "1"
  repository_dispatch:
    types: [run-now]

# 결과물을 저장소에 푸시하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 실행이 겹치지 않도록 한 번에 하나씩 차례로 돌립니다.
concurrency:
  group: auto-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul

    steps:
      - name: 1. 저장소 내려받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 3. 필요한 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 4. 스킬·규칙 자동 로드 확인
        run: |
          echo "== skills-lock.json 등록 스킬 =="
          python -c "import json; print('\n'.join(json.load(open('skills-lock.json'))['skills']))"
          echo "== 폴더에 있는 스킬 파일 =="
          find .agents/skills .claude/skills -name SKILL.md 2>/dev/null | sort || true
          echo "== 지침 규칙 파일 =="
          ls SKILL.md CLAUDE.md AGENTS.md .claude/CLAUDE.md 2>/dev/null || true
          find rules .claude/rules -name '*.md' 2>/dev/null | sort || true

      - name: 5. 프로그램 실행 (모든 스킬·규칙 적용 + 검수)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK_OVERRIDE: ${{ github.event.inputs.task || github.event.client_payload.task || '' }}
          REFINE_PASSES: ${{ github.event.inputs.refine_passes || github.event.client_payload.refine_passes || '1' }}
        run: python scripts/auto_run.py

      - name: 6. 결과물을 저장소로 백업
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ memory/
          if git diff --cached --quiet; then
            echo "새로 바뀐 결과물이 없어 백업을 건너뜁니다."
            exit 0
          fi
          git commit -m "자동 실행 결과물 $(date +'%Y-%m-%d %H:%M') (${{ github.event_name }})"
          # 그사이 저장소가 바뀌었을 수 있으니 최대 3번까지 맞춰서 다시 올립니다.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "푸시 실패, ${i}번째 재시도..."
            sleep 5
          done
          exit 1

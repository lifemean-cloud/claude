# ============================================================
#  매일 밤 12시(한국 시간) 자동 출근부
#  - 내 컴퓨터가 꺼져 있어도 GitHub 가상 컴퓨터가 대신 실행합니다.
#  - taste-skill 디자인 규칙(.agents/skills)을 읽어 결과물을 만들고
#    output/ 폴더에 저장한 뒤 이 저장소로 백업(커밋+푸시)합니다.
# ============================================================
name: 매일 자동 실행 (auto_run)

on:
  schedule:
    # GitHub 시계는 UTC 기준 → UTC 15:00 = 한국 시간 00:00 (자정)
    # ※ GitHub 사정으로 몇 분~수십 분 늦게 시작될 수 있습니다.
    - cron: "0 15 * * *"
  # Actions 탭에서 [Run workflow] 버튼으로 지금 바로 실행해 볼 수 있습니다.
  workflow_dispatch:

# 결과물을 저장소에 푸시하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

# 실행이 겹치지 않도록 한 번에 하나만 돌립니다.
concurrency:
  group: auto-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul

    steps:
      - name: 1. 저장소 내려받기
        uses: actions/checkout@v4

      - name: 2. 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 3. 필요한 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 4. 프로그램 실행 (taste-skill 규칙 적용)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/auto_run.py

      - name: 5. 결과물을 저장소로 백업
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "새로 바뀐 결과물이 없어 백업을 건너뜁니다."
            exit 0
          fi
          git commit -m "자동 실행 결과물 $(date +'%Y-%m-%d')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
